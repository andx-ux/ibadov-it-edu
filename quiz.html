<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnteraktiv Test | A.İbadov IT-Edu</title>
    <!-- Подключаем наш общий дизайн -->
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>

    <div class="quiz-container">

        <!-- Экран 1: Вопросы -->
        <div id="quiz-screen">
            <div class="header">
                <div class="quiz-header-row">
                    <h1>Biliklərinizi Yoxlayın</h1>
                    <button class="btn-finish" id="finish-btn" title="Testi bitir və nəticəni gör">✕ Bitir</button>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text" id="progress-text">Yüklənir...</div>
            </div>

            <div class="question-text" id="question-text">Sual yüklənir...</div>
            <div id="options-container"></div>

            <div class="quiz-actions">
                <button class="btn btn-outline-skip" id="skip-btn">Bilmirəm, keç →</button>
                <button class="btn" id="next-btn" disabled>Növbəti Sual</button>
            </div>
        </div>

        <!-- Экран 2: Результаты (скрыт по умолчанию) -->
        <div id="result-screen" class="result-screen">
            <h2>Test Tamamlandı!</h2>
            <div class="score-circle" id="score-display">0/0</div>
            <p class="feedback" id="feedback-text"></p>

            <div class="result-stats">
                <div class="stat-item stat-correct">
                    <span class="stat-num" id="stat-correct">0</span>
                    <span class="stat-label">✅ Düzgün</span>
                </div>
                <div class="stat-item stat-wrong">
                    <span class="stat-num" id="stat-wrong">0</span>
                    <span class="stat-label">❌ Səhv</span>
                </div>
                <div class="stat-item stat-skipped">
                    <span class="stat-num" id="stat-skipped">0</span>
                    <span class="stat-label">⏭️ Keçilmiş</span>
                </div>
            </div>

            <button class="btn" onclick="location.reload()">Yenidən Sına</button>
            <a href="index.html" class="btn"
                style="background-color: #1F2937; margin-top: 10px; display: block; text-align: center; text-decoration: none;">Dərslərə
                Qayıt</a>
        </div>

    </div>

    <!-- В самом низу подключаем логику -->
    <script src="js/quiz.js?v=3"></script>
    <script src="js/protect.js?v=3"></script>
</body>

</html>
